# Optional Portainer stack template (maintainer private deploy).
# REGISTRY, REPO, TAG and secrets come from your deploy environment — do not hardcode them.
services:
  app:
    image: ${REGISTRY}/${REPO}:${TAG}
    ports:
      - "8080:8080"
    environment:
      - LISTEN_URL=0.0.0.0:8080
      - DATABASE_PATH=/app/backend/data/firesimplefin.db
      - FRONTEND_DIST=/app/frontend/dist
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FIREFLY_BASE_URL=${FIREFLY_BASE_URL}
      - FIREFLY_TOKEN=${FIREFLY_TOKEN}
    volumes:
      - app-data:/app/backend/data
    restart: unless-stopped

volumes:
  app-data:
