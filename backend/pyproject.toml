[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "firesimplefin"
description = "Connect bank via SimpleFIN, upload transactions to Firefly III"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography >= 44.0.0",
    "fastapi >= 0.115.0",
    "httpx >= 0.27.0",
    "pydantic >= 2.9.0",
    "pydantic-settings >= 2.6.0",
    "thefuzz >= 0.19.0",
    "uvicorn[standard] >= 0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.3.0",
    "pytest-asyncio >= 0.24.0",
    "respx >= 0.21.0",
    "ruff >= 0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/firesimplefin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
